<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scale ladder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='3' fill='%234ec9a0'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%236aa9ff' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23b48ef5' stroke-width='1.4' stroke-dasharray='3 3'/%3E%3C/svg%3E">
<style>
  :root{--bg:#070a10;--panel:#0f141d;--edge:#1e2735;--ink:#e9eff7;--dim:#8794a9;
    --ok:#4ec9a0;--warn:#f0b429;--bad:#ff7a66;--accent:#6aa9ff;--violet:#b48ef5}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  #app{display:grid;grid-template-columns:1fr 400px;height:100%}
  #view{position:relative;min-width:0}
  canvas{display:block;width:100%;height:100%}

  #ladder{position:absolute;left:20px;top:0;bottom:0;width:140px;display:flex;flex-direction:column;
    justify-content:center;gap:0;pointer-events:auto}
  .rung{position:relative;padding:9px 0 9px 26px;cursor:pointer;color:var(--dim);font-size:12.5px;
    border-left:2px solid var(--edge);transition:color .15s}
  .rung:hover{color:var(--ink)}
  .rung.on{color:#fff;border-left-color:var(--accent)}
  .rung .dot{position:absolute;left:-6px;top:50%;transform:translateY(-50%);width:10px;height:10px;
    border-radius:50%;background:#1e2735;border:2px solid var(--edge)}
  .rung.on .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px #6aa9ff22}
  .rung.absent .dot{background:#2a1512;border-color:#6b2a1e}
  .rung .sz{display:block;font-size:10.5px;opacity:.6;font-variant-numeric:tabular-nums}
  .rung .tag{font-size:9px;letter-spacing:.5px;text-transform:uppercase;padding:1px 5px;border-radius:4px;
    border:1px solid currentColor;margin-left:6px;vertical-align:1px}
  .t-absent{color:var(--bad)}.t-id{color:var(--warn)}.t-obj{color:var(--ok)}

  #hud{position:absolute;right:16px;top:14px;text-align:right;font-variant-numeric:tabular-nums}
  #hud .big{font-size:30px;font-weight:600;letter-spacing:-.5px}
  #hud .sub{color:var(--dim);font-size:12px}
  #warnbar{position:absolute;left:0;right:0;bottom:0;padding:11px 20px;font-size:13px;font-weight:600;
    background:#2e1410;color:var(--bad);border-top:1px solid #6b2a1e;display:none}
  #zoom{position:absolute;right:16px;bottom:62px;width:220px}
  #zoom input{width:100%;accent-color:var(--accent)}
  #zoom .lab{color:var(--dim);font-size:11px;text-align:right}

  #side{border-left:1px solid var(--edge);background:var(--panel);overflow-y:auto;padding:18px}
  h1{font-size:15px;margin:0 0 3px}
  .lede{color:var(--dim);font-size:12.5px;margin-bottom:16px}
  h2{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);margin:18px 0 7px}
  .lvl{font-size:21px;font-weight:600;margin-bottom:2px}
  .what{color:var(--dim);font-size:13px;margin-bottom:12px}
  .box{background:#0a0f16;border:1px solid var(--edge);border-radius:9px;padding:12px;margin:9px 0;font-size:13px}
  .box.absent{border-color:#6b2a1e;background:#180e0c}
  .box.id{border-color:#5d4a10;background:#1a1507}
  .box h3{margin:0 0 5px;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--dim)}
  .box p{margin:0;color:#c6d3e4}
  .box.absent p{color:#ffb3a3}
  code{background:#0a0f16;border:1px solid var(--edge);padding:1px 5px;border-radius:4px;font-size:11.5px;color:var(--accent)}
  .cov{display:flex;gap:4px;margin:10px 0}
  .cov div{flex:1;height:6px;border-radius:3px;background:#2a3444}
  .cov div.y{background:var(--ok)}.cov div.i{background:var(--warn)}.cov div.n{background:var(--bad)}
  .foot{color:var(--dim);font-size:12px;margin-top:18px;border-top:1px solid var(--edge);padding-top:12px}
  @media(max-width:980px){#app{grid-template-columns:1fr;grid-template-rows:55vh 1fr}
    #side{border-left:0;border-top:1px solid var(--edge)}#ladder{left:8px;width:120px}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="app">
  <div id="view">
    <canvas id="c"></canvas>
    <div id="ladder"></div>
    <div id="hud"><div class="big" id="hud-size"></div><div class="sub" id="hud-sub"></div></div>
    <div id="zoom"><div class="lab">zoom — 4 decades, organelle to organism</div><input type="range" id="z" min="0" max="400" value="100"></div>
    <div id="warnbar"></div>
  </div>
  <aside id="side">
    <h1>Scale ladder</h1>
    <div class="lede" id="lede"></div>
    <div class="cov" id="cov"></div>
    <div id="detail"></div>
    <div class="foot" id="foot"></div>
  </aside>
</div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

let RUNGS = [], COV = null, GAP = null, CELLS = [];
try {
  const r = await fetch('./ladder.json');
  const d = await r.json();
  RUNGS = d.rungs ?? []; COV = d.coverage; GAP = d.the_gap; CELLS = d.cells ?? [];
} catch (e) { $('lede').textContent = `could not load ladder.json: ${e.message}`; }

let idx = RUNGS.findIndex(r => r.id === 'cell'); if (idx < 0) idx = 0;

// ---------------------------------------------------------------- scene
const cv = $('c'), renderer = new THREE.WebGLRenderer({antialias:true, canvas:cv});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x070a10);
const cam = new THREE.PerspectiveCamera(45,1,0.01,4000); cam.position.set(0,40,150);
const controls = new OrbitControls(cam, renderer.domElement); controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xbcd4ff,0x101418,1.1));
const key = new THREE.DirectionalLight(0xffffff,1.15); key.position.set(60,110,80); scene.add(key);
const group = new THREE.Group(); scene.add(group);
function resize(){const w=$('view').clientWidth,h=$('view').clientHeight;
  renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
addEventListener('resize',resize);

const sphere = new THREE.IcosahedronGeometry(1,3);
const lowSphere = new THREE.IcosahedronGeometry(1,1);

function clear(){ while(group.children.length) group.remove(group.children[0]); }

// Each rung draws what the pipeline ACTUALLY HAS at that level. Where it has nothing, the scene says so
// rather than drawing a plausible stand-in - a pretty tissue here would be the exact error the whole
// project is built to avoid.
function build(rung){
  clear();
  const absent = rung.represented_as === null;
  const idOnly = /identifier|CURIE/.test(rung.represented_as ?? '');

  if (rung.id === 'cell' && CELLS.length){
    // the REAL cells from the worked .life example
    const mat = new THREE.MeshStandardMaterial({color:0x4ec9a0,roughness:.5,transparent:true,opacity:.78});
    const wire = new THREE.MeshBasicMaterial({color:0x4ec9a0,wireframe:true,transparent:true,opacity:.2});
    for (const c of CELLS){
      const m = new THREE.Mesh(sphere, mat); m.position.set(...c.centre);
      m.scale.setScalar(c.radius); group.add(m);
      const w = new THREE.Mesh(sphere, wire); w.position.copy(m.position); w.scale.setScalar(c.radius*1.003); group.add(w);
    }
  } else if (rung.id === 'organelle'){
    // no organelle object exists. Show the measurement that DOES exist: fluctuating points inside one
    // cell outline, because organelles enter our data only as the noise source for a cell-level number.
    const outline = new THREE.Mesh(sphere, new THREE.MeshBasicMaterial({color:0x2a3444,wireframe:true,transparent:true,opacity:.35}));
    outline.scale.setScalar(34); group.add(outline);
    for (let i=0;i<120;i++){
      const m = new THREE.Mesh(lowSphere, new THREE.MeshStandardMaterial({color:0xff7a66,roughness:.6}));
      const a=Math.random()*7, b=Math.acos(2*Math.random()-1), r=28*Math.cbrt(Math.random());
      m.position.set(r*Math.sin(b)*Math.cos(a), r*Math.cos(b), r*Math.sin(b)*Math.sin(a));
      m.scale.setScalar(1.1); m.userData.jit = true; group.add(m);
    }
  } else if (rung.id === 'tissue'){
    // nothing. A deliberately empty frame with a ghost of the cells it would be made of.
    const ghost = new THREE.MeshBasicMaterial({color:0x44505f,wireframe:true,transparent:true,opacity:.14});
    for (let i=0;i<90;i++){
      const m = new THREE.Mesh(lowSphere, ghost);
      m.position.set((Math.random()-.5)*150,(Math.random()-.5)*42,(Math.random()-.5)*110);
      m.scale.setScalar(5.5); group.add(m);
    }
  } else if (rung.id === 'organ'){
    // an identifier in a graph: draw the graph, because that is literally all there is.
    const nodes = [['organism',0,34],['fin',-34,6],['lepidotrichium',-34,-28],['jaw',34,6],['tooth',34,-28]];
    const lineMat = new THREE.LineBasicMaterial({color:0xf0b429,transparent:true,opacity:.5});
    const nmat = new THREE.MeshStandardMaterial({color:0xf0b429,roughness:.45});
    const pos = {};
    nodes.forEach(([n,x,y])=>{ const m=new THREE.Mesh(sphere,nmat); m.position.set(x,y,0); m.scale.setScalar(5); group.add(m); pos[n]=m.position; });
    for (const [a,b] of [['fin','organism'],['jaw','organism'],['lepidotrichium','fin'],['tooth','jaw']]){
      const g = new THREE.BufferGeometry().setFromPoints([pos[a],pos[b]]);
      group.add(new THREE.Line(g,lineMat));
    }
  } else {
    // organism: a coarse body, explicitly a depiction
    const body = new THREE.Mesh(sphere, new THREE.MeshStandardMaterial({color:0x6aa9ff,roughness:.5,transparent:true,opacity:.55}));
    body.scale.set(60,18,11); group.add(body);
    const tail = new THREE.Mesh(new THREE.ConeGeometry(1,1,16), new THREE.MeshStandardMaterial({color:0x6aa9ff,roughness:.5,transparent:true,opacity:.45}));
    tail.scale.set(16,26,2); tail.position.set(-68,0,0); tail.rotation.z=Math.PI/2; group.add(tail);
    const wire = new THREE.Mesh(sphere, new THREE.MeshBasicMaterial({color:0x6aa9ff,wireframe:true,transparent:true,opacity:.17}));
    wire.scale.copy(body.scale).multiplyScalar(1.004); group.add(wire);
  }

  const wb = $('warnbar');
  if (absent){ wb.style.display='block'; wb.textContent = `NOTHING IS DRAWN HERE BECAUSE NOTHING IS STORED HERE — the ${rung.label} level has no representation in any format in this project.`; }
  else if (idOnly){ wb.style.display='block'; wb.style.background='#2b2208'; wb.style.color='#f0b429'; wb.style.borderTopColor='#5d4a10';
    wb.textContent = `AN ORGAN EXISTS HERE ONLY AS AN IDENTIFIER IN A GRAPH — no geometry, no material, no size.`; }
  else { wb.style.display='none'; wb.style.background=''; wb.style.color=''; wb.style.borderTopColor=''; }
}

function fmt(m){
  if (m >= 1e-2) return `${(m*100).toFixed(1)} cm`;
  if (m >= 1e-3) return `${(m*1000).toFixed(1)} mm`;
  if (m >= 1e-6) return `${(m*1e6).toFixed(1)} µm`;
  return `${(m*1e9).toFixed(0)} nm`;
}

function renderLadder(){
  $('ladder').innerHTML = RUNGS.map((r,i)=>{
    const absent = r.represented_as === null;
    const idOnly = /identifier|CURIE/.test(r.represented_as ?? '');
    const tag = absent ? '<span class="tag t-absent">none</span>'
      : idOnly ? '<span class="tag t-id">id only</span>' : '<span class="tag t-obj">object</span>';
    return `<div class="rung ${i===idx?'on':''} ${absent?'absent':''}" data-i="${i}">
      <span class="dot"></span>${esc(r.label)}${tag}<span class="sz">${fmt(r.size_m)}</span></div>`;
  }).join('');
  $('ladder').querySelectorAll('.rung').forEach(el=>el.addEventListener('click',()=>select(+el.dataset.i)));
}

function renderSide(){
  const r = RUNGS[idx]; if(!r) return;
  const absent = r.represented_as === null;
  const idOnly = /identifier|CURIE/.test(r.represented_as ?? '');
  $('hud-size').textContent = fmt(r.size_m);
  $('hud-sub').textContent = r.label;
  $('detail').innerHTML = `
    <div class="lvl">${esc(r.label)}</div>
    <div class="what">${esc(r.what)}</div>
    <div class="box ${absent?'absent':idOnly?'id':''}">
      <h3>represented as</h3>
      <p>${absent ? 'nothing' : `<code>${esc(r.represented_as)}</code>`}</p>
    </div>
    <div class="box ${absent?'absent':''}"><h3>what that means</h3><p>${esc(r.representation_detail)}</p></div>
    <div class="box"><h3>measured by</h3><p>${esc(r.measured_by)}</p></div>
    <div class="box ${absent?'absent':''}"><h3>what breaks without it</h3><p>${esc(r.what_breaks_without_it)}</p></div>
    ${r.mesh ? `<div class="box"><h3>mesh</h3><p>${esc(r.mesh)}</p></div>` : ''}`;
}

function select(i){ idx=Math.max(0,Math.min(RUNGS.length-1,i)); build(RUNGS[idx]); renderLadder(); renderSide();
  $('z').value = String(Math.round((idx/(RUNGS.length-1))*400)); }

$('z').addEventListener('input', e=>{
  const t = +e.target.value/400;
  select(Math.round(t*(RUNGS.length-1)));
});

if (COV){
  $('lede').innerHTML = esc(COV.headline);
  $('cov').innerHTML = RUNGS.map(r=>{
    const absent = r.represented_as===null, idOnly=/identifier|CURIE/.test(r.represented_as??'');
    return `<div class="${absent?'n':idOnly?'i':'y'}" title="${esc(r.label)}"></div>`;
  }).join('');
}
if (GAP) $('foot').innerHTML = `<b style="color:var(--ink)">${esc(GAP.the_claim)}</b><br><br>${esc(GAP.why_it_is_not_merely_a_todo)}<br><br>${esc(GAP.the_measurable_consequence)}`;

renderLadder(); if (RUNGS.length){ select(idx); }
resize();
(function loop(){
  const t = performance.now()/1000;
  group.children.forEach((m,i)=>{ if(m.userData.jit){ m.position.x += Math.sin(t*3+i)*0.045; m.position.y += Math.cos(t*2.6+i*1.7)*0.045; } });
  controls.update(); renderer.render(scene,cam); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
