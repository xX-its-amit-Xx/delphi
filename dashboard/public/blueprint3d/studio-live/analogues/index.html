<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analogue mining</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M8 4v24M24 4v24' stroke='%236aa9ff' stroke-width='2.5' fill='none'/%3E%3Cpath d='M8 10h16M8 16h16M8 22h16' stroke='%234ec9a0' stroke-width='1.6'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#070a0f; --panel:#10151e; --edge:#1e2735; --ink:#e8eef7; --dim:#8794a9;
    --ok:#4ec9a0; --warn:#f0b429; --bad:#ff7a66; --accent:#6aa9ff; --violet:#b48ef5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
  #app{display:grid;grid-template-columns:1fr 392px;height:100%}
  #stage{position:relative;min-width:0}
  canvas{display:block;width:100%;height:100%}

  #top{position:absolute;inset:0 0 auto 0;padding:14px 18px;display:flex;gap:14px;align-items:flex-start;
    background:linear-gradient(#070a0fee,#070a0f00);pointer-events:none;flex-wrap:wrap}
  #top h1{font-size:15px;margin:0;letter-spacing:.2px;pointer-events:auto}
  #top .q{color:var(--dim);font-size:13px;max-width:62ch}
  #cases{position:absolute;left:18px;bottom:18px;display:flex;gap:8px;flex-wrap:wrap}
  .case{background:#0d121a;border:1px solid var(--edge);color:var(--ink);border-radius:999px;
    padding:7px 14px;font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
  .case:hover{border-color:var(--accent)}
  .case[aria-pressed=true]{border-color:var(--accent);background:#132033;color:#fff}
  .case .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}

  #rail{position:absolute;right:18px;top:64px;display:flex;flex-direction:column;gap:3px;pointer-events:none}
  .st{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--dim);
    padding:3px 9px;border-radius:6px;border:1px solid transparent}
  .st b{font-weight:600;letter-spacing:.4px;text-transform:uppercase;font-size:10.5px}
  .st.on{color:var(--ink);background:#10151ecc;border-color:var(--edge)}
  .st .pip{width:8px;height:8px;border-radius:2px;background:#2a3444;flex:none}
  .st.done .pip{background:var(--ok)}
  .st.refuse .pip{background:var(--bad)}
  .st.degrade .pip{background:var(--warn)}

  #side{border-left:1px solid var(--edge);background:var(--panel);overflow-y:auto;padding:18px}
  h2{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
  .big{font-size:19px;line-height:1.3;margin:0 0 6px;font-weight:600}
  .verdict{display:inline-block;padding:4px 11px;border-radius:6px;font-size:12px;font-weight:600;
    letter-spacing:.3px;margin-bottom:12px}
  .v-addable{background:#06281d;color:var(--ok);border:1px solid #14543c}
  .v-refuse{background:#2e1410;color:var(--bad);border:1px solid #6b2a1e}
  .v-degrade{background:#2b2208;color:var(--warn);border:1px solid #5d4a10}
  .box{background:#0b1017;border:1px solid var(--edge);border-radius:9px;padding:12px;margin:10px 0}
  .box.refuse{border-color:#6b2a1e;background:#1a0e0b}
  .box h3{margin:0 0 6px;font-size:12.5px;color:var(--ink)}
  .box p{margin:0;color:var(--dim);font-size:12.5px}
  ul{margin:8px 0 0;padding-left:17px;color:var(--dim);font-size:12.5px}
  li{margin:5px 0}
  code{background:#0b1017;border:1px solid var(--edge);padding:1px 5px;border-radius:4px;font-size:11.5px}
  .mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:11.5px;line-height:1.5}
  .ctl{display:flex;gap:8px;align-items:center;margin:14px 0 4px}
  button.go{flex:1;background:#132033;border:1px solid var(--accent);color:#fff;border-radius:7px;
    padding:9px;font:inherit;cursor:pointer}
  button.go:hover{background:#18283f}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .foot{color:var(--dim);font-size:11.5px;margin-top:14px;border-top:1px solid var(--edge);padding-top:12px}
  @media(max-width:980px){#app{grid-template-columns:1fr;grid-template-rows:56vh 1fr}
    #side{border-left:0;border-top:1px solid var(--edge)}#rail{display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="top">
      <div>
        <h1 id="title">Analogue mining</h1>
        <div class="q" id="subtitle">loading…</div>
      </div>
    </div>
    <div id="rail"></div>
    <div id="cases"></div>
  </div>

  <aside id="side">
    <h2 id="stagename">stage</h2>
    <div class="big" id="stagewhat"></div>
    <div id="verdict"></div>
    <div id="detail"></div>

    <div class="ctl">
      <button class="go" id="play">replay</button>
    </div>
    <input type="range" id="scrub" min="0" max="7" step="1" value="0">

    <div class="foot" id="foot"></div>
  </aside>
</div>

<script type="module">
const $ = id => document.getElementById(id);
const CASE_TINT = { addable: '#4ec9a0', 'polygenic-not-a-single-edit': '#f0b429', 'wrong-organism': '#ff7a66' };

let SB = null, caseIdx = 0, stageIdx = 0, t0 = performance.now(), playing = true;

try {
  const r = await fetch('./storyboard.json');
  if (!r.ok) throw new Error(`${r.status}`);
  SB = await r.json();
} catch (e) {
  $('subtitle').textContent = `could not load storyboard.json: ${e.message}. Generate it with: node analogues/storyboard.mjs`;
}

// ------------------------------------------------------------------ canvas scene
const cv = $('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = Math.min(devicePixelRatio || 1, 2);
function resize() {
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
}
addEventListener('resize', resize);

// Deterministic jitter so the scene is the same every load - an animation that reshuffles itself
// looks like it is computing something new each time, and it is not.
function rnd(i) { const x = Math.sin(i * 12.9898) * 43758.5453; return x - Math.floor(x); }

let nodes = [], hub = { x: 0, y: 0 };
function layout() {
  const c = SB?.cases?.[caseIdx];
  const mine = c?.stages?.find(s => s.id === 'mine');
  const list = mine?.species ?? [];
  hub = { x: W * 0.22, y: H * 0.52 };
  const n = Math.max(list.length, 1);
  nodes = list.map((s, i) => {
    // two staggered arcs so labels do not collide, with deterministic jitter
    const arc = i % 2;
    const a = -0.95 + (i / Math.max(n - 1, 1)) * 1.9 + (rnd(i) - 0.5) * 0.06;
    const R = Math.min(W * 0.42, H * 0.46) * (arc ? 0.74 : 1.0) * (0.92 + rnd(i + 7) * 0.12);
    return {
      ...s,
      x: hub.x + Math.cos(a) * R * 1.35,
      y: hub.y + Math.sin(a) * R,
      hit: rnd(i + 3) > 0.42,      // which references returned something, fixed per index
      r: 4.5 + rnd(i + 11) * 2.5,
    };
  });
}

function stageProgress() {
  const dt = (performance.now() - t0) / 1000;
  return Math.max(0, Math.min(1, dt / 2.4));
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  const c = SB?.cases?.[caseIdx];
  if (!c) { requestAnimationFrame(draw); return; }
  const stage = c.stages[stageIdx];
  const p = stageProgress();
  const now = performance.now() / 1000;

  // ---- background grid, very faint
  ctx.strokeStyle = '#0e141d'; ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 48) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 48) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  const refused = stage.outcome === 'refuse';
  const tint = refused ? '#ff7a66' : stage.outcome === 'degrade' ? '#f0b429' : '#6aa9ff';

  if (stageIdx <= 4) {
    // ---- edges hub -> species, drawn in as mining proceeds
    nodes.forEach((nd, i) => {
      const appear = i / Math.max(nodes.length, 1);
      const on = stageIdx >= 1 && p > appear * 0.75;
      if (!on) return;
      const reach = stageIdx === 1 ? Math.min(1, (p - appear * 0.75) * 3) : 1;
      const ex = hub.x + (nd.x - hub.x) * reach, ey = hub.y + (nd.y - hub.y) * reach;
      ctx.beginPath(); ctx.moveTo(hub.x, hub.y);
      ctx.quadraticCurveTo((hub.x + nd.x) / 2, (hub.y + nd.y) / 2 - 26, ex, ey);
      ctx.strokeStyle = stageIdx >= 2 && !nd.hit ? '#1a222e' : (stageIdx >= 2 ? '#2a5e4d' : '#1d2a3a');
      ctx.lineWidth = stageIdx >= 2 && nd.hit ? 1.6 : 1;
      ctx.stroke();

      // travelling pulse while mining
      if (stageIdx === 1 && reach >= 1) {
        const k = (now * 0.6 + i * 0.13) % 1;
        const px = hub.x + (nd.x - hub.x) * k, py = hub.y + (nd.y - hub.y) * k - Math.sin(k * Math.PI) * 26;
        ctx.beginPath(); ctx.arc(px, py, 2.4, 0, 7); ctx.fillStyle = '#6aa9ff'; ctx.fill();
      }
    });

    // ---- species nodes
    nodes.forEach((nd, i) => {
      const appear = i / Math.max(nodes.length, 1);
      const on = stageIdx >= 1 && p > appear * 0.75;
      const live = on && stageIdx >= 2;
      ctx.beginPath(); ctx.arc(nd.x, nd.y, nd.r * (on ? 1 : 0.5), 0, 7);
      ctx.fillStyle = !on ? '#141c27' : live && nd.hit ? '#4ec9a0' : live ? '#263040' : '#3a4a60';
      ctx.fill();
      if (live && nd.hit) { ctx.beginPath(); ctx.arc(nd.x, nd.y, nd.r + 4 + Math.sin(now * 2 + i) * 1.2, 0, 7);
        ctx.strokeStyle = '#4ec9a033'; ctx.lineWidth = 1.5; ctx.stroke(); }
      if (on && W > 760) {
        ctx.fillStyle = live && nd.hit ? '#9fb3c8' : '#45566b';
        ctx.font = '11px ui-sans-serif,system-ui';
        ctx.textAlign = nd.x > hub.x ? 'left' : 'right';
        ctx.fillText(nd.name ?? nd.binomial ?? '', nd.x + (nd.x > hub.x ? 11 : -11), nd.y + 4);
      }
    });

    // ---- the hub: the base organism being edited
    ctx.beginPath(); ctx.arc(hub.x, hub.y, 15 + Math.sin(now * 1.6) * 1.2, 0, 7);
    ctx.fillStyle = refused ? '#3a1a14' : '#10263a'; ctx.fill();
    ctx.strokeStyle = tint; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#cfe0f5'; ctx.font = '600 11.5px ui-sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('base organism', hub.x, hub.y + 34);
  }

  if (stageIdx === 5) drawPhenome(p, tint);
  if (stageIdx >= 6) drawCassette(p, stage, refused);

  // ---- a refusal is drawn across the scene, not tucked in a panel
  if (refused) {
    ctx.fillStyle = '#ff7a6615';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#ff7a6655'; ctx.lineWidth = 2; ctx.strokeRect(6, 6, W - 12, H - 12);
  }
  requestAnimationFrame(draw);
}

function drawPhenome(p, tint) {
  const cx = W * 0.5, cy = H * 0.5;
  const pairs = [['source phenotype', 'target phenotype']];
  ctx.font = '600 13px ui-sans-serif'; ctx.textAlign = 'center';
  ctx.fillStyle = '#9fb3c8';
  ctx.fillText(pairs[0][0], cx - 150, cy - 10);
  ctx.fillText(pairs[0][1], cx + 150, cy - 10);
  for (let i = 0; i < 7; i++) {
    const y = cy + 18 + i * 15, w = 110 * Math.min(1, p * 2);
    ctx.fillStyle = i % 3 === 2 ? '#2a3444' : '#1b4a3c';
    ctx.fillRect(cx - 150 - w / 2, y, w, 8);
    ctx.fillStyle = i % 3 === 2 ? '#2a3444' : '#1b4a3c';
    ctx.fillRect(cx + 150 - w / 2, y, w, 8);
    if (p > 0.5 && i % 3 !== 2) {
      ctx.beginPath(); ctx.moveTo(cx - 150 + w / 2, y + 4); ctx.lineTo(cx + 150 - w / 2, y + 4);
      ctx.strokeStyle = '#4ec9a044'; ctx.lineWidth = 1; ctx.stroke();
    }
  }
}

function drawCassette(p, stage, refused) {
  const parts = [
    ['5′ arm', 90, '#3a4a60'], ['promoter', 70, '#6aa9ff'], ['coding sequence', 150, '#4ec9a0'],
    ['tag', 44, '#b48ef5'], ['terminator', 60, '#f0b429'], ['3′ arm', 90, '#3a4a60'],
  ];
  const total = parts.reduce((a, b) => a + b[1], 0);
  const scale = Math.min(1, (W * 0.62) / total);
  let x = W * 0.5 - (total * scale) / 2;
  const y = H * 0.48;
  ctx.textAlign = 'center';
  parts.forEach((pt, i) => {
    const w = pt[1] * scale;
    const appear = Math.min(1, Math.max(0, (p - i * 0.11) * 5));
    if (appear <= 0) { x += w; return; }
    ctx.globalAlpha = refused ? 0.22 : appear;
    ctx.fillStyle = pt[2];
    const h = 30;
    ctx.beginPath(); ctx.roundRect(x, y - h / 2, w * appear, h, 4); ctx.fill();
    ctx.globalAlpha = refused ? 0.3 : 1;
    ctx.fillStyle = '#071017'; ctx.font = '600 10.5px ui-sans-serif';
    if (w * appear > 44) ctx.fillText(pt[0], x + (w * appear) / 2, y + 4);
    ctx.globalAlpha = 1;
    x += w;
  });
  if (!refused && p > 0.75) {
    const cut = W * 0.5 - (total * scale) / 2 + (90 + 70 + 150) * scale;
    ctx.strokeStyle = '#ff7a66'; ctx.lineWidth = 2; ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(cut, y - 34); ctx.lineTo(cut, y + 34); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#ff7a66'; ctx.font = '600 10.5px ui-sans-serif';
    ctx.fillText('cut site — 3 bp 5′ of the PAM', cut, y - 42);
  }
  if (refused) {
    ctx.fillStyle = '#ff7a66'; ctx.font = '600 14px ui-sans-serif';
    ctx.fillText('no cassette is designed for this request', W * 0.5, y + 74);
  }
}

// ------------------------------------------------------------------ panels
function renderCases() {
  const el = $('cases'); el.innerHTML = '';
  (SB?.cases ?? []).forEach((c, i) => {
    const v = c.stages.find(s => s.id === 'verdict')?.verdict ?? 'unknown';
    const b = document.createElement('button');
    b.className = 'case'; b.setAttribute('aria-pressed', String(i === caseIdx));
    b.innerHTML = `<span class="dot" style="background:${CASE_TINT[v] ?? '#8794a9'}"></span>${c.case_id.replace(/-/g, ' ')}`;
    b.onclick = () => { caseIdx = i; stageIdx = 0; t0 = performance.now(); layout(); renderCases(); renderStage(); };
    el.appendChild(b);
  });
}

function renderRail() {
  const c = SB?.cases?.[caseIdx]; if (!c) return;
  $('rail').innerHTML = c.stages.map((s, i) => {
    const cls = i === stageIdx ? 'on' : i < stageIdx ? (s.outcome === 'refuse' ? 'refuse' : s.outcome === 'degrade' ? 'degrade' : 'done') : '';
    return `<div class="st ${cls}"><span class="pip"></span><b>${s.title}</b></div>`;
  }).join('');
}

function renderStage() {
  const c = SB?.cases?.[caseIdx]; if (!c) return;
  const s = c.stages[stageIdx];
  $('title').textContent = c.case_id.replace(/-/g, ' ');
  const req = c.stages[0];
  $('subtitle').textContent = req.what_is_actually_being_asked ?? req.request ?? '';
  $('stagename').textContent = `${stageIdx + 1} / ${c.stages.length} · ${s.title}`;
  $('stagewhat').textContent = s.what;
  $('scrub').max = String(c.stages.length - 1);
  $('scrub').value = String(stageIdx);

  const vmap = { refuse: 'v-refuse', degrade: 'v-degrade', proceed: 'v-addable' };
  $('verdict').innerHTML = `<span class="verdict ${vmap[s.outcome]}">${s.outcome}</span>`;

  let html = '';
  if (s.id === 'mine') {
    html += `<div class="box"><h3>${s.species_searched} reference genomes searched</h3><p>${s.note}</p></div>`;
    if (s.species?.length) html += `<ul>${s.species.slice(0, 8).map(x => `<li><b style="color:var(--ink)">${x.name ?? x.binomial}</b>${x.why ? ` — ${x.why}` : ''}</li>`).join('')}</ul>`;
  }
  if (s.id === 'map' && s.refusal) html += `<div class="box refuse"><h3>refused here</h3><p>${s.refusal}</p></div>`;
  if (s.id === 'map' && s.analogy_class) html += `<div class="box"><h3>analogy class</h3><p>${s.analogy_class}</p></div>`;
  if (s.id === 'phenome' && s.what_would_have_to_be_measured) {
    const m = s.what_would_have_to_be_measured;
    html += `<div class="box"><h3>what would have to be measured</h3><p>${Array.isArray(m) ? m.join('; ') : m}</p></div>`;
  }
  if (s.id === 'cassette') {
    if (s.refusal) html += `<div class="box refuse"><h3>no cassette</h3><p>${s.refusal}</p></div>`;
    if (s.crispr_is_the_right_tool) html += `<div class="box"><h3>is CRISPR even the right tool?</h3><p>${typeof s.crispr_is_the_right_tool === 'string' ? s.crispr_is_the_right_tool : JSON.stringify(s.crispr_is_the_right_tool)}</p></div>`;
  }
  if (s.id === 'verdict') {
    html += `<div class="box ${s.verdict === 'addable' ? '' : 'refuse'}"><h3>verdict: ${s.verdict ?? 'unknown'}</h3>`;
    if (s.how_it_could_fail) html += `<p>${s.how_it_could_fail}</p>`;
    html += `</div>`;
    if (s.sources?.length) html += `<h2 style="margin-top:14px">sources</h2><ul>${s.sources.slice(0, 6).map(x => `<li class="mono">${typeof x === 'string' ? x : (x.citation ?? x.doi ?? JSON.stringify(x))}</li>`).join('')}</ul>`;
  }
  $('detail').innerHTML = html;

  $('foot').innerHTML = `${SB.the_headline ?? ''}<br><br>${SB.why_it_can_fail?.because ?? ''}`;
  renderRail();
}

$('scrub').addEventListener('input', e => { playing = false; stageIdx = +e.target.value; t0 = performance.now(); renderStage(); });
$('play').addEventListener('click', () => { stageIdx = 0; t0 = performance.now(); playing = true; renderStage(); });

setInterval(() => {
  if (!playing || !SB?.cases?.[caseIdx]) return;
  if (performance.now() - t0 > 3200) {
    const n = SB.cases[caseIdx].stages.length;
    if (stageIdx < n - 1) { stageIdx++; t0 = performance.now(); renderStage(); } else { playing = false; }
  }
}, 160);

if (SB?.cases?.length) {
  renderCases(); layout(); renderStage();
} else if (SB) {
  // The storyboard loaded and is EMPTY. Say so, rather than sitting on "loading…" looking broken -
  // an empty state that looks like a hang is indistinguishable from a hang.
  $('subtitle').textContent = 'the storyboard built, and it has no cases in it yet.';
  $('stagename').textContent = 'nothing to show';
  $('stagewhat').textContent = 'The case modules have not landed yet.';
  $('detail').innerHTML = `<div class="box"><h3>how to fill this in</h3>
    <p>Run <code>node analogues/storyboard.mjs</code> once <code>analogues/cases.mjs</code> exists. It
    degrades rather than failing, so an empty storyboard means the modules are absent — not that the
    pipeline found nothing.</p></div>`;
  $('foot').textContent = SB.why_it_can_fail?.because ?? '';
}
resize(); draw();
</script>
</body>
</html>
